# LAB ONLY. IRIS supplies Listen 52773 on the httpd command line.
# Native API transport stays inside this container; never publish port 52773.
<VirtualHost *:52773>
    <Location />
        Require expr "%{REMOTE_ADDR} == '127.0.0.1'"
    </Location>
</VirtualHost>

Listen 52774
<VirtualHost *:52774>
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLSessionTickets Off
    SSLCertificateFile /run/irisops-tls/server.crt
    SSLCertificateKeyFile /run/irisops-tls/server.key
    SSLOptions +StdEnvVars
    LimitRequestBody 4096
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    <Location />
        Require all denied
    </Location>
    # Only this managed profile is exposed. Native portal/API are NOT a fallback.
    <LocationMatch "^/(api/irisops-managed-guard/v1/|csp/ops/guard-managed/)">
        Require all granted
    </LocationMatch>
    # Do not retain mixed frontend generations across image upgrades/rollback.
    # This cannot retroactively invalidate responses cached by earlier images.
    <LocationMatch "^/csp/ops/guard-managed/">
        RequestHeader unset If-Modified-Since
        RequestHeader unset If-None-Match
        Header onsuccess unset Cache-Control
        Header always set Cache-Control "no-store"
    </LocationMatch>
</VirtualHost>
